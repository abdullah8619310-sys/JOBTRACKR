server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # JobTrackr has no client-side routing today, but this keeps the
    # container correct if that changes — any unmatched path falls back to
    # index.html instead of a bare nginx 404.
    location / {
        try_files $uri /index.html;
    }
}
